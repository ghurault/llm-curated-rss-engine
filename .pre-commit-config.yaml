# Ideally the rev should match the package version in the environment
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        name: ruff-isort
        args: ["--select", "I", "--fix"]
      - id: ruff-check
        name: ruff-docformatter
        args: ["--select", "D", "--ignore", "D202", "--fix-only", "--fix"]
      - id: ruff-check
        name: ruff-check
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/reteps/dockerfmt
    rev: v0.5.4
    hooks:
      - id: dockerfmt
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # mirrors-prettier is archived, so pre-commit installs Prettier itself here.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.9]
        files: \.(json|jsonc|md|ya?ml)$
  # Installed in the devcontainer, not by pre-commit, so quality.yml skips them.
  - repo: local
    hooks:
      - id: taplo
        name: taplo
        entry: taplo format
        language: system
        types: [toml]
      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        types: [shell]
default_install_hook_types: [pre-commit, commit-msg]
