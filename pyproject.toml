[build-system]
requires = ["setuptools >= 64", "setuptools_scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "curated-feed"
description = "Collect RSS items into a local corpus for editorial-policy evaluation."
authors = [
    { name = "Guillem Hurault" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "anthropic>=0.122",
]

[project.optional-dependencies]
dev = [
    "black",
    "ipykernel",
    "ipywidgets",
    "pdoc",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "typos",
    "uv",
]

[project.scripts]
curate-fetch = "curated_feed.fetch:main"
curate-export = "curated_feed.export:main"
curate-score = "curated_feed.score:main"
curate-paywall = "curated_feed.paywall:main"
curate-select = "curated_feed.select:main"
curate-render = "curated_feed.render:main"
curate-deploy = "curated_feed.deploy:main"
curate-run = "curated_feed.cli:main"
curate-template = "curated_feed.template:main"
curate-validate = "curated_feed.validate:main"

[project.urls]
Repository = "https://github.com/ghurault/llm-curated-rss"
# Homepage = ""
# Documentation = ""
# Issues = ""

[tool.setuptools.packages.find]
where = ["src"]

# The scoring prompt and the two runner templates are part of the engine, not of
# a runner's configuration, so they travel in the wheel. Declared rather than
# left to `include-package-data`: that plus setuptools_scm's file finder gets
# them into the sdist, and the wheel is what the image installs.
[tool.setuptools.package-data]
curated_feed = ["*.md", "*.toml"]

[tool.setuptools_scm]

[tool.black]
# Pin the target so Black's AST safety check does not warn when the interpreter
# in the image is older than its newest supported syntax.
target-version = ["py312"]

[tool.pyright]
typeCheckingMode = "standard"
exclude = ["**/.*", "**/__pycache__", "**/node_modules"]
reportUnnecessaryTypeIgnoreComment = false # Can have discrepancy between CLI and Language Server if set to true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", # builtins
    "B", # flake8-bugbear
    "C4", # comprehensions
    "C90", # McCabe cyclomatic complexity
    "D", # pydocstyle
    "E", # pycodestyle error
    "F", # pyflakes
    "FURB", # modernising Python codebase
    "I", # isort
    "ICN", # import conventions
    "N", # PEP8 naming
    "NPY", # numpy
    "PD", # pandas
    "PERF", # performance
    "PGH004", # Use specific rules in noqa
    "PIE790", # Unnecessary placeholders
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactoring
    "PLW", # pylint warning
    "RUF", # ruff specific rules
    "S", # bandit (security issues)
    "SIM", # flake8-simplify
    "TID", # Tidy imports
    "TRY300", # Use else block in try-except
    "UP", # pyupgrade
    "W", # pycodestyle warning
]
ignore = [
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D107", # Missing docstring in __init__
    "D202", # Blank line after function docstring
    "E501", # Avoid enforcing line-length violations
    "PD015", # Use pd.merge
    "PERF203", # Try-except in loop
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"] # Ignore import violations
"tests/*" = [
    "D100", # Undocumented public module
    "D101", # Missing docstring in public class
    "S101", # Assert used
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 3

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*"]

[tool.ruff.lint.isort]
known-first-party = [
    "curated_feed",
] # Add others local/private packages

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--color=yes",
    "--cov-report=term-missing",
    "--cov=curated_feed",
    "--cov=tests",
    "--doctest-modules",
]
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
