<!doctype html>
<html lang="en">
  <head>
    <title>A flagged article inside a graph</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "Reader" },
          { "@type": "Organization", "name": "Reader Media" },
          {
            "@type": "NewsArticle",
            "headline": "A flagged article inside a graph",
            "isAccessibleForFree": "False"
          }
        ]
      }
    </script>
  </head>
  <body>
    <article><p>The first paragraph, and then a wall.</p></article>
  </body>
</html>
