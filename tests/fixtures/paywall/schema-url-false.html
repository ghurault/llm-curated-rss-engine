<!doctype html>
<html lang="en">
  <head>
    <title>A flagged article using the schema.org URL form</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "isAccessibleForFree": "http://schema.org/False"
      }
    </script>
  </head>
  <body>
    <article><p>The first paragraph, and then a wall.</p></article>
  </body>
</html>
