name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # setuptools_scm reads the version from annotated tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements.txt, not requirements-dev.txt: this is the exact set the
      # scheduled run installs, so a module in src/ that only imports because a
      # development group happened to be present fails here rather than at
      # 06:00 with nothing published.
      #
      # The test group is installed under the development lock, without changing
      # the application's pinned dependency set.
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install --constraint requirements-dev.txt --group test

      # Doctests included: pytest is configured to collect from src/ as well,
      # and several of them are the only test a small function has.
      - run: pytest --cov-report=xml

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
