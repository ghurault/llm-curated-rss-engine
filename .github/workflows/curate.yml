name: curate

# One runner's day, as a job somebody else calls: the environment, the memory
# and the pipeline. The caller owns the clock, the matrix and the secrets.
#
# The engine runs from its published image, pinned by digest, so the caller's
# 06:00 run changes behaviour only when this file's pin moves. The interface —
# inputs, secrets, cache keys and paths — is what callers depend on, and was
# settled before the move into this repository so that the move left it alone.
#
# A reusable workflow cannot matrix itself, which is why this takes one feed and
# not a list: the fan-out has to happen on the calling side, and stays there.
on:
  workflow_call:
    inputs:
      feed:
        description: The runner to curate, which is a directory name under feeds/
        type: string
        required: true
      provider:
        description: Scorer to use
        type: string
        default: anthropic
      date:
        description: Replay a past collection day (YYYY-MM-DD); empty means today
        type: string
        default: ""
    secrets:
      # None of them required, which is not laxity. A run with the stub scorer
      # calls nothing and a runner whose [deploy] provider is "none" uploads
      # nothing, so insisting on credentials would stop a replay in a repository
      # that holds none — and each stage already reports the credential it is
      # missing better than a declaration here could.
      ANTHROPIC_API_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Moving the pin is how an engine release reaches the callers: take the
    # digest from the summary of an `image` run on main.
    container:
      image: ghcr.io/ghurault/llm-curated-rss-engine@sha256:d47492f758eec62ace8e2fc74866688a33638ce69db32feeadb391013bc50c33

    steps:
      # The caller's repository, not this workflow's: a reusable workflow runs
      # against the caller's checkout, which is where feeds/ comes from. The
      # engine is in the image, so no history is needed.
      - uses: actions/checkout@v7

      # The corpus and the published log are the pipeline's memory, and are the
      # reader's data rather than the repository's, so they are not in git.
      #
      # The paths are the convention every runner's config is copied from, and
      # they are written here rather than read out of that config: nothing can
      # tell this workflow where a runner keeps its state, so a runner that moves
      # its corpus loses its cache without saying so. The cache is expected to
      # belong to the *calling* repository, which is worth confirming the first
      # time the call is cross-repository — losing it is a re-fetch, not an error.
      #
      # Keyed on the feed before the run id, so that one runner's restore-keys
      # prefix cannot match another's cache and hand it the wrong corpus.
      #
      # Losing this cache costs a shorter feed for a day, not a storm of
      # resurfaced items: an entry's id is the article URL, so anything
      # republished is recognised by the reader as something it has already
      # seen. That is the invariant paying for itself.
      - name: Restore the corpus and the published log
        uses: actions/cache/restore@v6
        with:
          path: |
            eval/corpus/${{ inputs.feed }}
            state/${{ inputs.feed }}
          key: pipeline-state-${{ inputs.feed }}-${{ github.run_id }}
          restore-keys: pipeline-state-${{ inputs.feed }}-

      # Inputs are passed through the environment rather than interpolated into
      # the script, so nothing typed into the dispatch form can become a command.
      - name: Curate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG: feeds/${{ inputs.feed }}/config.toml
          PROVIDER: ${{ inputs.provider }}
          DAY: ${{ inputs.date }}
        run: |
          arguments=(--config "$CONFIG" --deploy --provider "$PROVIDER")
          if [ -n "$DAY" ]; then
            arguments+=(--date "$DAY")
          fi
          curate-run "${arguments[@]}"

      # Saved even when the run failed: the corpus was still collected, and
      # re-fetching it tomorrow would double-count nothing but waste the request.
      - name: Save the corpus and the published log
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            eval/corpus/${{ inputs.feed }}
            state/${{ inputs.feed }}
          key: pipeline-state-${{ inputs.feed }}-${{ github.run_id }}
