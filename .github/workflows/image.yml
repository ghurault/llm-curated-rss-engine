name: image

# The engine's execution environment: built and exercised on every change, and
# published to GHCR from main once every check below has passed. A configuration
# repository pins what this publishes by digest; the tags are for finding one.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: curated-feed:ci
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      # setuptools_scm reads the version from annotated tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The build context holds no .git on purpose, so the version is worked out
      # here and passed in. Asked of setuptools_scm rather than assembled from
      # `git describe`, so that the image reports what a build from this
      # checkout would report and not an approximation of it.
      - name: Work out the version
        id: version
        run: |
          pip install --quiet setuptools_scm
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --build-arg "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" .

      # A digest is what pins an engine, and the version is how a run says which
      # one it got. The fallback the Dockerfile carries for a bare `docker build`
      # must not be what a published image reports.
      - name: The engine knows which engine it is
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installed=$(docker run --rm "$IMAGE" \
            python -c 'from importlib.metadata import version; print(version("curated-feed"))')
          echo "built from $VERSION, installed as $installed"
          test "$installed" != "0.0.0+unknown"

      # With the network switched off, which is the assertion rather than a
      # precaution: `npx wrangler@4` would resolve the range against the
      # registry, and a bare package name runs the release the image installed.
      # That property is the whole reason for baking one in, and it is invisible
      # from a runner that has a registry to fall back on.
      - name: The upload's toolchain, offline
        run: |
          docker run --rm --network none "$IMAGE" node --version
          docker run --rm --network none "$IMAGE" npx --yes wrangler --version

      # A whole day from an installed engine, which is the only place the
      # package data and the entry points are really exercised. The throwaway
      # runner is built inside the mounted workspace rather than in /tmp, so
      # that the step below can say what a container leaves there.
      - name: A day, end to end
        run: |
          docker run --rm --network none -v "$PWD:/w" -w /w "$IMAGE" \
            scripts/smoke.sh build/smoke

      # The ownership answer in one line: a container job runs as root, so
      # everything it wrote into the workspace is root's and the runner user
      # cannot remove it without sudo. Harmless here, and the thing to remember
      # when the callee runs in a container and `actions/cache/save` starts
      # saving a state/<feed> written this way.
      - name: What the container left behind
        run: |
          ls -ld build build/smoke
          sudo rm -rf build

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image the checks above ran, retagged rather than rebuilt, so what is
      # published is exactly what was verified. `+` is not allowed in a tag.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in "${VERSION//+/-}" "sha-$GITHUB_SHA" latest; do
            docker tag "$IMAGE" "$REGISTRY_IMAGE:$tag"
          done
          docker push --all-tags "$REGISTRY_IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:latest")
          {
            echo "### Published"
            echo
            echo "Version \`$VERSION\`, pin with:"
            echo
            echo "\`\`\`"
            echo "$digest"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
